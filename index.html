<title>Jason.Vietnam — Insider Access</title>

<style>
  :root{
    --bg: #121212;
    --bg-elev: #191919;
    --card: #1C1C1C;
    --line: rgba(212,175,55,0.18);
    --line-soft: rgba(255,255,255,0.07);
    --gold: #D4AF37;
    --gold-soft: rgba(212,175,55,0.55);
    --ink: #F2F0EA;
    --muted: #9C9A92;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background: var(--bg); color: var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width: 1000px; margin:0 auto; padding:0 24px; }
  a{ color:inherit; }

  /* ---------- TOP SOCIAL BAR ---------- */
  .topbar{ background: var(--bg-elev); border-bottom:1px solid var(--line); }
  .topbar .wrap{ display:flex; justify-content:space-between; align-items:center; padding:10px 24px; flex-wrap:wrap; gap:10px; }
  .topbar .social-row{ display:flex; gap:20px; flex-wrap:wrap; }
  .social-item{ display:flex; align-items:center; gap:7px; font-size:12px; text-decoration:none; color:var(--muted); transition:.2s ease; }
  .social-item:hover{ color: var(--gold); }
  .social-item svg{ width:15px; height:15px; stroke: var(--gold); flex-shrink:0; }
  .topbar .tagline{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.08em; color:#5f5d57; }

  /* ---------- NAV ---------- */
  nav{ position:sticky; top:0; z-index:40; background: rgba(18,18,18,0.9); backdrop-filter: blur(10px); border-bottom:1px solid var(--line-soft); }
  nav .wrap{ display:flex; justify-content:space-between; align-items:center; padding-top:16px; padding-bottom:16px; }
  .brand{ font-family:'Cormorant Garamond', serif; font-size:21px; letter-spacing:.05em; color:var(--gold); }
  .lang-switch{ display:flex; gap:2px; border:1px solid var(--line); border-radius:20px; padding:3px; }
  .lang-switch button{ background:none; border:none; color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:11px; padding:6px 14px; border-radius:16px; cursor:pointer; letter-spacing:.05em; }
  .lang-switch button.active{ background: var(--gold); color:#121212; font-weight:600; }

  /* ---------- HERO ---------- */
  .hero{ padding: 70px 0 60px; position:relative; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color: var(--gold-soft); margin-bottom:24px; display:flex; align-items:center; gap:10px; }
  .eyebrow::before{ content:""; width:22px; height:1px; background: var(--gold); }
  h1{ font-family:'Cormorant Garamond', serif; font-weight:500; font-size: clamp(36px, 5.8vw, 60px); line-height:1.14; max-width:800px; letter-spacing:.01em; }
  h1 em{ font-style:italic; color: var(--gold); font-weight:500; }
  .hero p.lede{ margin-top:22px; max-width:560px; font-size:16px; line-height:1.75; color: var(--muted); }
  .hero-cta{ margin-top:34px; display:flex; gap:14px; flex-wrap:wrap; }
  .btn{ font-family:'Inter', sans-serif; font-weight:600; font-size:13px; letter-spacing:.02em; padding:14px 26px; border-radius:2px; cursor:pointer; border:1px solid var(--gold); display:inline-flex; align-items:center; gap:8px; text-decoration:none; transition:.2s ease; }
  .btn-gold{ background: var(--gold); color:#121212; }
  .btn-gold:hover{ background:#e6c25c; }
  .btn-ghost{ background:transparent; color: var(--ink); border-color: var(--line-soft); }
  .btn-ghost:hover{ border-color: var(--gold); color: var(--gold); }
  .stat-strip{ margin-top:48px; display:flex; gap:40px; flex-wrap:wrap; border-top:1px solid var(--line-soft); padding-top:24px; }
  .stat-strip div{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--muted); }
  .stat-strip strong{ display:block; font-family:'Cormorant Garamond', serif; font-size:26px; color: var(--gold); font-weight:600; }

  /* ---------- BIO ---------- */
  .bio{ padding: 20px 0 70px; }
  .bio-inner{ display:grid; grid-template-columns: 130px 1fr; gap:36px; align-items:start; border-top:1px solid var(--line-soft); padding-top:44px; }
  .bio-mark{ font-family:'Cormorant Garamond', serif; font-size:70px; color: var(--gold-soft); line-height:1; }
  .bio-inner h2{ font-family:'Cormorant Garamond', serif; font-size:26px; margin-bottom:16px; }
  .bio-inner p{ font-size:14.5px; line-height:1.9; color: var(--muted); max-width:640px; }
  @media (max-width: 640px){ .bio-inner{ grid-template-columns:1fr; } .bio-mark{ display:none; } }

  /* ---------- SERVICES ---------- */
  .services{ padding: 20px 0 20px; }
  .section-head{ margin-bottom:36px; border-top:1px solid var(--line-soft); padding-top:44px; }
  .section-head .eyebrow{ margin-bottom:14px; }
  .section-head h2{ font-family:'Cormorant Garamond', serif; font-size:32px; font-weight:500; }
  .section-head p{ color:var(--muted); font-size:14px; margin-top:8px; max-width:440px; }
  .card-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap:18px; }
  .card{ position:relative; background: linear-gradient(180deg, var(--card), #171717); border:1px solid var(--line); border-radius:6px; padding:28px 26px 24px; display:flex; flex-direction:column; gap:12px; overflow:hidden; }
  .card:hover{ border-color: var(--gold-soft); }
  .tag{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color: var(--gold); }
  .card h3{ font-family:'Cormorant Garamond', serif; font-size:22px; font-weight:500; }
  .card p{ font-size:13px; color: var(--muted); line-height:1.6; }
  .card-foot{ margin-top:18px; display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line-soft); padding-top:16px; }
  .card-foot .price{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--muted); }
  .card-btn{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:500; letter-spacing:.04em; background:none; border:1px solid var(--gold-soft); color: var(--gold); padding:8px 14px; border-radius:2px; cursor:pointer; }
  .card-btn:hover{ background: var(--gold); color:#121212; }

  /* ---------- TESTIMONIALS / EVENTS (flexible block) ---------- */
  .flex-block{ padding: 60px 0 20px; }
  .flex-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap:16px; }
  .flex-card{ border:1px dashed var(--line); border-radius:6px; padding:24px; min-height:150px; display:flex; flex-direction:column; justify-content:center; gap:8px; background: rgba(212,175,55,0.02); }
  .flex-card .flex-tag{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color: var(--gold-soft); }
  .flex-card p{ font-size:13px; color:#6c6a64; line-height:1.6; font-style:italic; }

  /* ---------- CHANNELS ---------- */
  .channels{ padding: 40px 0 80px; }
  .channel-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap:14px; }
  .channel-link{ display:flex; align-items:center; gap:14px; padding:18px 20px; border:1px solid var(--line-soft); border-radius:5px; text-decoration:none; transition:.2s ease; }
  .channel-link:hover{ border-color: var(--gold-soft); background: rgba(212,175,55,0.04); }
  .channel-link svg{ width:20px; height:20px; stroke: var(--gold); flex-shrink:0; }
  .channel-link .ch-name{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color: var(--muted); }
  .channel-link .ch-handle{ font-size:13.5px; font-weight:500; margin-top:2px; }

  footer{ padding:30px 0 46px; text-align:center; border-top:1px solid var(--line-soft); }
  footer button{ background:none; border:none; font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:#6c6a64; cursor:pointer; letter-spacing:.06em; }
  footer button:hover{ color: var(--gold); }

  .overlay{ position:fixed; inset:0; background: rgba(0,0,0,0.72); display:none; align-items:center; justify-content:center; padding:20px; z-index:60; }
  .overlay.open{ display:flex; }
  .modal{ background: var(--card); border:1px solid var(--line); border-radius:6px; max-width:440px; width:100%; padding:32px 28px; position:relative; }
  .modal h3{ font-family:'Cormorant Garamond', serif; font-size:24px; color: var(--gold); margin-bottom:4px; }
  .modal p.sub{ font-size:13px; color: var(--muted); margin-bottom:20px; }
  .close-x{ position:absolute; top:18px; right:18px; background:none; border:none; font-size:16px; cursor:pointer; color: var(--muted); }
  label{ font-size:11.5px; font-weight:600; color: var(--muted); display:block; margin:14px 0 6px; letter-spacing:.02em; }
  input{ width:100%; padding:11px 12px; border:1px solid var(--line-soft); border-radius:3px; font-family:'Inter',sans-serif; font-size:14px; background:#141414; color: var(--ink); }
  input:focus{ outline:none; border-color: var(--gold); }
  .submit-btn{ margin-top:22px; width:100%; background: var(--gold); color:#121212; border:none; padding:14px; border-radius:3px; font-weight:600; font-size:14px; cursor:pointer; }
  .submit-btn:hover{ background:#e6c25c; }
  .form-note{ font-size:11px; color:#6c6a64; margin-top:10px; line-height:1.5; }
  .success-box{ text-align:center; padding:20px 0; }
  .success-box .mark{ font-size:32px; color: var(--gold); margin-bottom:10px; }

  .admin-screen{ display:none; min-height:100vh; }
  .admin-screen.open{ display:block; }
  .admin-top{ background: var(--bg-elev); border-bottom:1px solid var(--line-soft); padding:26px 0; }
  .admin-top .wrap{ display:flex; justify-content:space-between; align-items:center; }
  .admin-top h2{ font-family:'Cormorant Garamond', serif; font-size:24px; color: var(--gold); }
  .back-link{ background:none; border:1px solid var(--line-soft); color:var(--ink); font-size:11px; padding:9px 14px; border-radius:3px; cursor:pointer; font-family:'IBM Plex Mono', monospace; }
  .kpi-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin: 32px 0; }
  .kpi{ background: var(--card); border:1px solid var(--line-soft); border-radius:5px; padding:20px; }
  .kpi .label{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .kpi .value{ font-family:'Cormorant Garamond', serif; font-size:32px; font-weight:600; color: var(--gold); margin-top:6px; }
  .table-wrap{ background: var(--card); border:1px solid var(--line-soft); border-radius:5px; overflow:auto; margin-bottom:60px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px; }
  th{ text-align:left; background: var(--bg-elev); color:var(--gold); padding:11px 14px; font-family:'IBM Plex Mono', monospace; font-weight:500; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
  td{ padding:11px 14px; border-bottom:1px solid var(--line-soft); color: var(--ink); }
  tr:last-child td{ border-bottom:none; }
  .empty-row td, .loading-row td{ text-align:center; color:#6c6a64; padding:34px; font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .pill{ font-family:'IBM Plex Mono', monospace; font-size:10px; padding:3px 8px; border-radius:10px; background: rgba(212,175,55,0.12); color: var(--gold); }

  @media (max-width: 600px){ .stat-strip{ gap:22px; } .topbar .wrap{ justify-content:center; } }
</style>
</head>

<script>
  const GOOGLE_SCRIPT_URL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
  const ADMIN_PASSWORD = "jsavn16888";

  const SERVICES = ['s1','s2','s3','s4','s5','s6'];
  let currentService = 's1';

  function renderCards(){
    const grid = document.getElementById('cardGrid');
    const d = DICT[currentLang];
    grid.innerHTML = SERVICES.map(key => `
      <div class="card">
        <span class="tag">${d[key+'tag']}</span>
        <h3>${d[key+'title']}</h3>
        <p>${d[key+'desc']}</p>
        <div class="card-foot">
          <span class="price">${d[key+'price']}</span>
          <button class="card-btn" onclick="openForm('${key}')">${d.inquire}</button>
        </div>
      </div>
    `).join('');
  }

  function applyI18n(){
    const d = DICT[currentLang];
    document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if(d[k]!==undefined) el.textContent = d[k]; });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { const k = el.getAttribute('data-i18n-html'); if(d[k]!==undefined) el.innerHTML = d[k]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { const k = el.getAttribute('data-i18n-ph'); if(d[k]!==undefined) el.placeholder = d[k]; });
    document.getElementById('formTitle').textContent = d[currentService+'title'];
    renderCards();
  }

  function setLang(lang){
    currentLang = lang;
    document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    applyI18n();
  }

  function openForm(serviceKey){
    currentService = serviceKey;
    document.getElementById('formTitle').textContent = DICT[currentLang][serviceKey+'title'];
    document.getElementById('formView').style.display = 'block';
    document.getElementById('successView').style.display = 'none';
    document.getElementById('bookingForm').reset();
    document.getElementById('overlay').classList.add('open');
  }
  function closeForm(){ document.getElementById('overlay').classList.remove('open'); }

  async function submitBooking(e){
    e.preventDefault();
    const d = DICT[currentLang];
    const entry = {
      service: d[currentService+'title'], name: document.getElementById('f_name').value,
      contact: document.getElementById('f_contact').value, date: document.getElementById('f_date').value,
      amount: document.getElementById('f_amount').value, lang: currentLang, createdAt: new Date().toISOString()
    };
    try{
      if(GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.startsWith("PASTE_")){
        await fetch(GOOGLE_SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(entry) });
      }
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    }catch(err){ alert('送出時發生問題，麻煩直接私訊我，謝謝！'); console.error(err); }
  }

  function showAdmin(){
    const pw = prompt('請輸入後台密碼 / Enter admin password');
    if(pw !== ADMIN_PASSWORD){ if(pw !== null) alert(DICT[currentLang].wrongPw); return; }
    document.getElementById('publicSite').style.display = 'none';
    document.getElementById('adminScreen').classList.add('open');
    loadAdminData();
  }
  function hideAdmin(){ document.getElementById('adminScreen').classList.remove('open'); document.getElementById('publicSite').style.display = 'block'; }

  async function loadAdminData(){
    const d = DICT[currentLang];
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = `<tr class="loading-row"><td colspan="6">${d.loading}</td></tr>`;
    let list = [];
    try{
      if(GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.startsWith("PASTE_")){
        const res = await fetch(GOOGLE_SCRIPT_URL);
        list = await res.json();
      }
    }catch(err){ console.error(err); list = []; }
    list.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    const todayStr = new Date().toISOString().slice(0,10);
    const todayEntries = list.filter(x => (x.createdAt||'').slice(0,10) === todayStr);
    function sumAmounts(entries){ let t=0; entries.forEach(x=>{ const n=parseFloat((x.amount||'').toString().replace(/[^0-9.]/g,'')); if(!isNaN(n)) t+=n; }); return t; }
    document.getElementById('kpiRow').innerHTML = `
      <div class="kpi"><div class="label">${d.kpiToday}</div><div class="value">${todayEntries.length}</div></div>
      <div class="kpi"><div class="label">${d.kpiTodayAmt}</div><div class="value">${sumAmounts(todayEntries).toLocaleString()}</div></div>
      <div class="kpi"><div class="label">${d.kpiTotal}</div><div class="value">${list.length}</div></div>
      <div class="kpi"><div class="label">${d.kpiTotalAmt}</div><div class="value">${sumAmounts(list).toLocaleString()}</div></div>
    `;
    if(list.length === 0){ tbody.innerHTML = `<tr class="empty-row"><td colspan="6">${d.emptyRow}</td></tr>`; return; }
    tbody.innerHTML = list.map(x => `
      <tr><td>${x.createdAt ? new Date(x.createdAt).toLocaleString('zh-TW') : '—'}</td><td><span class="pill">${x.service||''}</span></td>
      <td>${x.name||''}</td><td>${x.contact||''}</td><td>${x.date||'—'}</td><td>${x.amount||'—'}</td></tr>
    `).join('');
  }

  applyI18n();
</script>
